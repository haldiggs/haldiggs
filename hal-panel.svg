<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="200" height="500" role="img" aria-label="HAL panel with red eye">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b6f73"/>
      <stop offset="0.5" stop-color="#e3e6e8"/>
      <stop offset="1" stop-color="#6b6f73"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d1f"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="ring" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="0.7" stop-color="#9aa0a5"/>
      <stop offset="1" stop-color="#3a3d40"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="0.12" stop-color="#ff3b1f"/>
      <stop offset="0.45" stop-color="#c00a0a"/>
      <stop offset="0.85" stop-color="#3a0000"/>
      <stop offset="1" stop-color="#120000"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2a10" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grille" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#b9bdc0"/>
      <circle cx="3" cy="3" r="1.4" fill="#5c6064"/>
    </pattern>
  </defs>

  <!-- brushed metal frame -->
  <rect x="0" y="0" width="200" height="500" rx="6" fill="url(#frame)"/>
  <!-- black face -->
  <rect x="12" y="12" width="176" height="352" rx="2" fill="url(#face)"/>

  <!-- nameplate -->
  <rect x="26" y="28" width="148" height="26" fill="#0a0a0a" stroke="#d8dcdf" stroke-width="1.5"/>
  <rect x="27" y="29" width="70" height="24" fill="#1f6fd6"/>
  <text x="62" y="47" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HAL</text>
  <text x="135" y="47" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">DIGGS</text>

  <!-- the eye -->
  <circle cx="100" cy="215" r="88" fill="url(#glow)"/>
  <circle cx="100" cy="215" r="66" fill="url(#ring)"/>
  <circle cx="100" cy="215" r="57" fill="#050505"/>
  <circle cx="100" cy="215" r="53" fill="url(#lens)"/>
  <circle cx="100" cy="222" r="5" fill="#fff3b0"/>
  <ellipse cx="100" cy="186" rx="34" ry="16" fill="url(#shine)"/>

  <!-- speaker grille -->
  <rect x="12" y="376" width="176" height="112" rx="2" fill="url(#grille)"/>
</svg>
